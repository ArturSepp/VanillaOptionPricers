[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vanilla-option-pricers"
version = "2.0.0"
description = "vanilla-option-pricers - Numba-vectorised Black-Scholes-Merton and Bachelier prices, Greeks, and implied-volatility fits over NumPy arrays for quantitative research pipelines"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Artur Sepp", email = "artursepp@gmail.com"},
]
keywords = [
    "option pricing",
    "black-scholes",
    "implied volatility",
    "vanilla options",
    "quantitative finance",
    "numba",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.10"

dependencies = [
    "numba>=0.60.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=8.0,<10.0",
    "myst-parser>=4.0,<6.0",
    "furo>=2024.8.6",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/ArturSepp/VanillaOptionPricers"
Documentation = "https://vanillaoptionpricers.readthedocs.io/en/stable/"
Repository = "https://github.com/ArturSepp/VanillaOptionPricers.git"
Issues = "https://github.com/ArturSepp/VanillaOptionPricers/issues"
Changelog = "https://github.com/ArturSepp/VanillaOptionPricers/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["vanilla_option_pricers*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["src/vanilla_option_pricers/tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

# Preserve byte-for-byte numerical modules during V0b. These narrow waivers describe
# pre-existing lint debt and must not be expanded for new code.
[tool.ruff.lint.per-file-ignores]
"src/vanilla_option_pricers/__init__.py" = ["F401", "I001"]
"src/vanilla_option_pricers/bachelier.py" = ["E501", "F541", "I001"]
"src/vanilla_option_pricers/black_scholes.py" = ["E501", "F541", "I001"]
"src/vanilla_option_pricers/utils.py" = ["E501", "I001"]
