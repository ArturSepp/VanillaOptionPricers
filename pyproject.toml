[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vanilla-option-pricers"
version = "2.2.0"
description = "Numba-vectorised Black-Scholes-Merton and Bachelier prices, Greeks, and implied-volatility fits over NumPy arrays for quantitative research pipelines"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Artur Sepp", email = "artursepp@gmail.com"},
]
keywords = [
    "option pricing",
    "black-scholes",
    "implied volatility",
    "vanilla options",
    "quantitative finance",
    "numba",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.10"

dependencies = [
    "numba>=0.60.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=8.0,<10.0",
    "myst-parser>=4.0,<6.0",
    "furo>=2024.8.6",
]

[dependency-groups]
test = [
    "pytest>=7.0.0",
]
lint = [
    "ruff==0.16.2",
]

[project.urls]
Homepage = "https://github.com/ArturSepp/VanillaOptionPricers"
Documentation = "https://vanillaoptionpricers.readthedocs.io"
Repository = "https://github.com/ArturSepp/VanillaOptionPricers"
Issues = "https://github.com/ArturSepp/VanillaOptionPricers/issues"
Changelog = "https://github.com/ArturSepp/VanillaOptionPricers/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["vanilla_option_pricers*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["src/vanilla_option_pricers/tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W"]
extend-select = ["TID251", "TID253", "ICN"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"trendfollowing".msg = "A1: subject packages never import each other."
"privateassets".msg = "A1: subject packages never import each other."
"stochvolmodels".msg = "A1: subject packages never import each other."
"goal_based_allocation".msg = "A1: subject packages never import each other."
"bbg_fetch".msg = "A1: vanilla-option-pricers has no declared dependency on bbg_fetch."
"factorlasso".msg = "A1: vanilla-option-pricers has no declared dependency on factorlasso."
"optimalportfolios".msg = "A1: vanilla-option-pricers has no declared dependency on optimalportfolios."
"option_chain_analytics".msg = "A1: vanilla-option-pricers has no declared dependency on option_chain_analytics."
"qis".msg = "A1: vanilla-option-pricers has no declared dependency on qis."

[tool.ruff.lint.flake8-tidy-imports]
banned-module-level-imports = [
    "yfinance",
    "pandas_datareader",
    "pybloqs",
    "plotly",
    "pyarrow",
    "psycopg2",
    "sqlalchemy",
]

[tool.ruff.lint.flake8-import-conventions.aliases]
numpy = "np"
pandas = "pd"

# Preserve byte-for-byte numerical modules during V0b. These narrow waivers describe
# pre-existing lint debt and must not be expanded for new code.
[tool.ruff.lint.per-file-ignores]
"src/vanilla_option_pricers/__init__.py" = ["F401"]
"src/vanilla_option_pricers/bachelier.py" = ["E501", "F541"]
"src/vanilla_option_pricers/black_scholes.py" = ["E501", "F541"]
"src/vanilla_option_pricers/utils.py" = ["E501"]
