name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Verify imports
      run: |
        python -c "
        from pathlib import Path
        import vanilla_option_pricers as package
        from vanilla_option_pricers import (
            compute_bsm_vanilla_price,
            compute_bsm_vanilla_slice_prices,
            compute_bsm_forward_grid_prices,
            compute_bsm_vanilla_price_vector,
            compute_bsm_vanilla_delta,
            compute_bsm_vanilla_vega,
            compute_bsm_vanilla_gamma,
            compute_bsm_vanilla_theta,
            infer_bsm_implied_vol,
            infer_bsm_ivols_from_slice_prices,
            compute_normal_price,
            compute_normal_slice_prices,
            infer_normal_implied_vol,
            ncdf, npdf,
        )
        package_path = Path(package.__file__).resolve()
        assert package_path.parent.name == 'vanilla_option_pricers'
        assert package_path.parent.parent.name == 'src'
        print(package_path)
        print('All imports OK')
        "

    - name: Run tests
      run: pytest src/vanilla_option_pricers/tests/ -v

  first-success-wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build tools and runtime dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build "numpy>=2.0" "numba>=0.60.0"

    - name: Build wheel and source distribution
      run: python -m build

    - name: Inspect and install the wheel
      run: >
        python -c "from pathlib import Path; import subprocess, sys, zipfile;
        wheel = next(Path('dist').glob('*.whl'));
        names = zipfile.ZipFile(wheel).namelist();
        assert not any(name.startswith('examples/') for name in names), names;
        subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheel)]);
        print(wheel)"

    - name: Run first success outside the checkout
      run: >
        python -c "import os, runpy, shutil, tempfile;
        from pathlib import Path;
        repo = Path.cwd().resolve();
        source = repo / 'examples' / 'getting_started' / 'pricing_and_iv.py';
        work = Path(tempfile.mkdtemp(prefix='vanilla-option-pricers-wheel-'));
        target = Path(shutil.copy2(source, work / source.name));
        os.chdir(work);
        runpy.run_path(str(target), run_name='__main__');
        import vanilla_option_pricers as package;
        package_path = Path(package.__file__).resolve();
        assert repo not in package_path.parents, (repo, package_path);
        print(f'wheel_import={package_path}')"
