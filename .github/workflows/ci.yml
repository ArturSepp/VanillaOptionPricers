# SHARED CI CORE v1.0 — T1 — synced 2026-08-22
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12", primary: true}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: ubuntu-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.12"}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: ${{ matrix.python-version }}

    - name: Sync the test environment
      # Primary cell installs uv.lock exactly; floating cells test today's resolution.
      # Retried because observed failures here are transport failures, not test failures.
      shell: bash
      run: |
        sync_cmd=(uv sync --group test ${{ matrix.primary && '--locked' || '--upgrade' }})
        for attempt in 1 2 3; do
          if "${sync_cmd[@]}"; then exit 0; fi
          if [ "$attempt" -eq 3 ]; then echo "::error::uv sync failed after 3 attempts"; exit 1; fi
          delay=$((attempt * 30 - 15))
          echo "::warning::uv sync attempt $attempt failed; retrying in ${delay}s"
          sleep "$delay"
        done

    - name: Verify imports
      run: |
        uv run --no-sync python -c "
        from pathlib import Path
        import vanilla_option_pricers as package
        from vanilla_option_pricers import (
            compute_bsm_vanilla_price,
            compute_bsm_vanilla_slice_prices,
            compute_bsm_forward_grid_prices,
            compute_bsm_vanilla_price_vector,
            compute_bsm_vanilla_delta,
            compute_bsm_vanilla_vega,
            compute_bsm_vanilla_gamma,
            compute_bsm_vanilla_theta,
            infer_bsm_implied_vol,
            infer_bsm_ivols_from_slice_prices,
            compute_normal_price,
            compute_normal_slice_prices,
            infer_normal_implied_vol,
            ncdf, npdf,
        )
        package_path = Path(package.__file__).resolve()
        assert package_path.parent.name == 'vanilla_option_pricers'
        assert package_path.parent.parent.name == 'src'
        print(package_path)
        print('All imports OK')
        "

    - name: Run tests
      run: uv run --no-sync pytest

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.12"

    - name: Check lint
      run: uv run --locked --only-group lint ruff check src/vanilla_option_pricers/ examples/

  wheel:
    name: built wheel (core install)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.12"

    - name: Build the wheel from the source distribution
      run: |
        uv build --sdist --clear --out-dir dist
        uv build --wheel dist/*.tar.gz --out-dir dist

    - name: Assert distribution contents
      run: |
        uv run --no-project python - <<'PY'
        import glob
        import tarfile
        import zipfile

        wheels = glob.glob("dist/*.whl")
        sdists = glob.glob("dist/*.tar.gz")
        assert len(wheels) == 1, wheels
        assert len(sdists) == 1, sdists

        wheel_names = zipfile.ZipFile(wheels[0]).namelist()
        sdist_names = tarfile.open(sdists[0]).getnames()
        assert "vanilla_option_pricers/__init__.py" in wheel_names
        assert "vanilla_option_pricers/tests/test_black_scholes.py" in wheel_names
        assert any(name.endswith("/src/vanilla_option_pricers/__init__.py") for name in sdist_names)
        assert not any(name.startswith("examples/") for name in wheel_names), wheel_names
        forbidden = {"run_local", "docs", "__pycache__"}
        assert not any(forbidden.intersection(name.split("/")) for name in wheel_names)
        assert not any(name.endswith((".pyc", ".pyo")) for name in wheel_names)
        PY

    - name: Install the wheel into a clean environment
      run: |
        uv venv --python 3.12 "$RUNNER_TEMP/wheelcheck-venv"
        uv pip install --python "$RUNNER_TEMP/wheelcheck-venv/bin/python" \
          "$(ls dist/*.whl)" pytest

    - name: Exercise the installed wheel from outside the checkout
      working-directory: ${{ runner.temp }}
      run: |
        source "$RUNNER_TEMP/wheelcheck-venv/bin/activate"
        mkdir -p "$RUNNER_TEMP/wheelcheck"
        cd "$RUNNER_TEMP/wheelcheck"
        python -m pytest --pyargs vanilla_option_pricers -q
        cp "$GITHUB_WORKSPACE/examples/getting_started/pricing_and_iv.py" .
        python pricing_and_iv.py
        python -c "from pathlib import Path; import vanilla_option_pricers as package; checkout = Path(r'${{ github.workspace }}').resolve(); package_path = Path(package.__file__).resolve(); assert not package_path.is_relative_to(checkout), (checkout, package_path); print(f'wheel_import={package_path}')"

  stack-policy:
    name: stack import boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Exercise policy regressions
        run: python .github/scripts/check_stack_imports.py --self-test
      - name: Check stack imports and optional adapter isolation
        run: python .github/scripts/check_stack_imports.py

  lowest-dependencies:
    name: lowest direct dependencies (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.10"
      - name: Keep the test environment outside the checkout
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/lowest-dependencies" >> "$GITHUB_ENV"
      - name: Resolve a fresh lowest-direct test environment
        # Upgrade ignores lockfile preference; this job never commits its experimental lock.
        run: uv sync --python 3.10 --resolution lowest-direct --upgrade --group test
      - name: Record installed versions
        run: uv pip freeze --python "$UV_PROJECT_ENVIRONMENT/bin/python"
      - name: Check optional dependencies stay outside package-root import
        run: uv run --no-sync python .github/scripts/check_stack_imports.py --check-root
      - name: Test declared dependency floors without live provider credentials
        run: uv run --no-sync pytest
